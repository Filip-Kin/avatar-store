services:
  avatar-store:
    build: .
    container_name: avatar-store
    restart: unless-stopped
    ports:
      # localhost only; nginx (avatars.filipkin.com) fronts it with TLS.
      - "127.0.0.1:8385:8000"
    volumes:
      - ./uploads:/uploads
      - ./pending:/pending
    environment:
      # Portal password (HTTP Basic fallback). Set in .env; compose refuses to start without it.
      - AVATAR_PORTAL_PASSWORD=${AVATAR_PORTAL_PASSWORD:?set AVATAR_PORTAL_PASSWORD in .env}
      # The Blue Alliance read API key: validates submitted teams/events + low-res avatar fallback.
      - TBA_API_KEY=${TBA_API_KEY:?set TBA_API_KEY in .env}
      # Discord webhook pinged on each public submission.
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:?set DISCORD_WEBHOOK_URL in .env}
      # Firebase (reuses the fta-buddy project) for public-submitter Google sign-in.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:?set FIREBASE_API_KEY in .env}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://avatars.filipkin.com}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
